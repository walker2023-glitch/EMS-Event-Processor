name: Verify and package
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev,backend,backend-test]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Test (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - name: Test (Windows desktop)
        if: runner.os == 'Windows'
        run: python -m pytest -q
      - name: Build Windows executable
        if: runner.os == 'Windows' && matrix.python == '3.12'
        run: python -m PyInstaller --noconfirm --clean ems-event-processor.spec
      - name: Smoke test packaged Windows application
        if: runner.os == 'Windows' && matrix.python == '3.12'
        run: python scripts/smoke_windows.py
      - name: Exercise packaged UI and capture Windows review images
        if: runner.os == 'Windows' && matrix.python == '3.12'
        run: python scripts/smoke_ui_windows.py
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows' && matrix.python == '3.12'
        with:
          name: EMS-UI-Windows-Review
          path: work/ui-windows/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && matrix.python == '3.12'
        with:
          name: EMS-Event-Processor-Windows
          path: dist/EMS Event Processor/

  backend-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: fictional-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      EMS_TEST_DATABASE_URL: postgresql://postgres:fictional-ci-only@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev,backend,backend-test]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m pytest -q tests/backend
      - run: python -m scripts.smoke_backend_local
