name: Verify and package
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - name: Test (Linux virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -q
      - name: Test (Windows desktop)
        if: runner.os == 'Windows'
        run: python -m pytest -q
      - name: Build Windows executable
        if: runner.os == 'Windows' && matrix.python == '3.12'
        run: python -m PyInstaller --noconfirm --clean ems-event-processor.spec
      - name: Smoke test packaged Windows application
        if: runner.os == 'Windows' && matrix.python == '3.12'
        run: python scripts/smoke_windows.py
      - name: Exercise packaged UI and capture Windows review images
        if: runner.os == 'Windows' && matrix.python == '3.12'
        run: python scripts/smoke_ui_windows.py
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows' && matrix.python == '3.12'
        with:
          name: EMS-UI-Windows-Review
          path: work/ui-windows/
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows' && matrix.python == '3.12'
        with:
          name: EMS-Event-Processor-Windows
          path: dist/EMS Event Processor/
