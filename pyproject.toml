[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ems-event-processor"
version = "0.1.0"
description = "Local Setup Worksheet report to organized Excel tables"
requires-python = ">=3.11"
dependencies = ["openpyxl>=3.1.5,<4", "xlrd>=2.0.1,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "xlwt==1.3.0", "ruff>=0.9,<1", "mypy>=1.14,<2", "types-openpyxl>=3.1", "types-xlrd>=2.0", "pyinstaller>=6.11,<7"]

[project.gui-scripts]
ems-event-processor = "ems_event_processor.ui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
